<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Don Nicolás - Menú Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bg-dark: #1e140f; --bg-card: #2d1f18; --accent-gold: #d97706; --accent-gold-hover: #b45309; --text-light: #f4ecd8; --border-color: #5c3f2d; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Georgia', serif; padding-bottom: 180px; }
        .sticky-container { position: sticky; top: 0; z-index: 1000; background: rgba(30, 20, 15, 0.95); backdrop-filter: blur(10px); padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .product-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; }
        .product-img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; }
        .btn-amber { background-color: var(--accent-gold); color: white; font-weight: bold; border-radius: 10px; }
        .category-title { color: var(--accent-gold); border-bottom: 2px solid var(--border-color); margin-top: 2rem; }
        .order-panel { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 600px; background: rgba(45, 31, 24, 0.98); border: 2px solid var(--accent-gold); border-radius: 20px; z-index: 1050; }
    </style>
</head>
<body>

    <div class="sticky-container shadow-sm mb-3 pt-3">
        <div class="container d-flex justify-content-between align-items-center mb-2" style="max-width: 600px;">
            <h4 class="text-warning fw-bold m-0">☕ Don Nicolás</h4>
            <span class="badge bg-warning text-dark px-3 rounded-pill">Mesa #<span id="label-mesa">{{ mesa }}</span></span>
        </div>
        <div class="container d-flex gap-2" style="max-width: 600px;">
            <button class="btn btn-outline-light btn-sm w-50" onclick="enviarAlerta('mesero')">🙋‍♂️ Llamar Mesero</button>
            <button class="btn btn-outline-warning btn-sm w-50" onclick="enviarAlerta('cuenta')">🧾 Pedir Cuenta</button>
        </div>
    </div>

    <div class="container" style="max-width: 600px;">
        {% for cat, productos in categorias.items() %}
        <h5 class="category-title">{{ cat }}</h5>
        {% for p in productos %}
        <div class="product-card p-3 mb-3 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <img src="/static/uploads/{{ p.imagen }}" class="product-img">
                <div>
                    <h6 class="text-warning">{{ p.nombre }}</h6>
                    <p class="text-success fw-bold">Q {{ "%.2f"|format(p.precio) }}</p>
                </div>
            </div>
            <button class="btn btn-amber px-3" onclick="agregarAlCarrito('{{ p.nombre }}', {{ p.precio }})">➕</button>
        </div>
        {% endfor %}
        {% endfor %}
    </div>

    <div id="contenedor-resumen-pedido" class="order-panel p-3" style="display: none;">
        <div class="d-flex justify-content-between align-items-center" data-bs-toggle="collapse" data-bs-target="#collapsePedido">
            <h5 class="text-warning fw-bold m-0 fs-6">📋 Su Pedido</h5>
            <span class="text-warning fw-bold fs-5" id="total-carrito">Q 0.00</span>
        </div>
        <div class="collapse mt-2" id="collapsePedido">
            <div id="lista-carrito" class="mb-3"></div>
            <button class="btn btn-amber w-100" onclick="enviarPedido()">🚀 Enviar Pedido</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let numeroMesa = urlParams.get('mesa') || '1';
        document.getElementById('label-mesa').innerText = numeroMesa;
        let carrito = [];

        function agregarAlCarrito(nombre, precio) {
            carrito.push({ nombre, precio });
            document.getElementById('contenedor-resumen-pedido').style.display = 'block';
            actualizarCarrito();
        }

        function actualizarCarrito() {
            let lista = document.getElementById('lista-carrito');
            lista.innerHTML = carrito.map(i => `<div class="d-flex justify-content-between text-light"><span>${i.nombre}</span><span>Q ${i.precio.toFixed(2)}</span></div>`).join('');
            document.getElementById('total-carrito').innerText = `Q ${carrito.reduce((a, b) => a + b.precio, 0).toFixed(2)}`;
        }

        async function enviarAlerta(tipo) {
            try {
                let res = await fetch('/api/alerta-mesero', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesa: parseInt(numeroMesa), tipo: tipo })
                });
                if(res.ok) alert(tipo === 'mesero' ? "🔔 Mesero avisado." : "🧾 Cuenta solicitada.");
                else alert("Error en el servidor.");
            } catch (e) { alert("Error de conexión."); }
        }

        async function enviarPedido() {
            try {
                let res = await fetch('/api/enviar-pedido', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesa: parseInt(numeroMesa), items: carrito, total: 0 })
                });
                if(res.ok) { alert("¡Pedido enviado!"); carrito = []; actualizarCarrito(); }
            } catch (e) { alert("Error de conexión."); }
        }

        // Conexión WebSockets segura para Render
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws/admin`);
    </script>
</body>
</html>
