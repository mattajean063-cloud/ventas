<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Don Nicolás - Menú Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1e140f;
            --bg-card: #2d1f18;
            --accent-gold: #d97706;
            --accent-gold-hover: #b45309;
            --text-light: #f4ecd8;
            --text-muted: #d1c7bd;
            --border-color: #5c3f2d;
        }

        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Georgia', serif; padding-bottom: 180px; }

        .sticky-container {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(30, 20, 15, 0.95);
            backdrop-filter: blur(10px);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .product-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; transition: all 0.2s; }
        .product-card:hover { transform: translateY(-2px); border-color: var(--accent-gold); }
        .product-img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; border: 1px solid var(--border-color); }

        .btn-amber { background-color: var(--accent-gold); color: white; font-weight: bold; border-radius: 10px; }
        .badge-mesa { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: white; font-weight: bold; }
        .category-title { color: var(--accent-gold); border-bottom: 2px solid var(--border-color); padding-bottom: 6px; margin-top: 2rem; }

        .btn-categoria { background-color: var(--bg-card); color: var(--text-light); border: 1px solid var(--border-color); border-radius: 20px; padding: 6px 16px; font-size: 0.9rem; }
        .btn-categoria.active { background-color: var(--accent-gold); color: white; border-color: var(--accent-gold); }

        .order-panel {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 600px;
            background: rgba(45, 31, 24, 0.98);
            border: 2px solid var(--accent-gold);
            border-radius: 20px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.7);
            z-index: 1050;
        }
    </style>
</head>
<body>

    <div class="sticky-container shadow-sm mb-3 pt-3">
        <div class="container d-flex justify-content-between align-items-center mb-2" style="max-width: 600px;">
            <h4 class="text-warning fw-bold m-0">☕ Don Nicolás</h4>
            <span class="badge badge-mesa fs-6 px-3 py-2 rounded-pill">Mesa #<span id="label-mesa">{{ mesa }}</span></span>
        </div>
        
        <div class="container d-flex gap-2 mb-2" style="max-width: 600px;">
            <button class="btn btn-outline-light btn-sm w-50 py-1" onclick="enviarAlerta('mesero')">🙋‍♂️ Llamar Mesero</button>
            <button class="btn btn-outline-warning btn-sm w-50 py-1" onclick="enviarAlerta('cuenta')">🧾 Pedir Cuenta</button>
        </div>

        <div class="container d-flex justify-content-center gap-2" style="max-width: 600px;">
            <button class="btn-categoria active" onclick="filtrarCategoria('todos', this)">🌟 Todos</button>
            <button class="btn-categoria" onclick="filtrarCategoria('Bebidas', this)">🥤 Bebidas</button>
            <button class="btn-categoria" onclick="filtrarCategoria('Comida', this)">🍳 Comida</button>
        </div>
    </div>

    <div class="container" style="max-width: 600px;">
        <!-- Lista de productos cargada dinámicamente -->
        {% for cat, productos in categorias.items() %}
        <div class="grupo-categoria" data-categoria="{{ cat }}">
            <h5 class="category-title">{{ cat }}</h5>
            {% for p in productos %}
            <div class="product-card p-3 mb-3 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <img src="/static/uploads/{{ p.imagen }}" class="product-img">
                    <div>
                        <h6 class="text-warning fw-bold">{{ p.nombre }}</h6>
                        <small class="text-muted">{{ p.descripcion }}</small>
                        <p class="text-success fw-bold">Q {{ "%.2f"|format(p.precio) }}</p>
                    </div>
                </div>
                <button class="btn btn-amber px-3" onclick="agregarAlCarrito('{{ p.nombre }}', {{ p.precio }})">➕</button>
            </div>
            {% endfor %}
        </div>
        {% endfor %}
    </div>

    <div id="contenedor-resumen-pedido" class="order-panel p-3 px-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center" data-bs-toggle="collapse" data-bs-target="#collapseDetallePedido">
            <h5 class="text-warning fw-bold m-0 fs-6">📋 Su Pedido</h5>
            <span class="text-warning fw-bold fs-5" id="total-carrito">Q 0.00</span>
        </div>
        <div class="collapse mt-2" id="collapseDetallePedido">
            <div id="lista-carrito" class="mb-3"></div>
            <button id="btn-enviar-pedido" class="btn btn-amber w-100 py-2" onclick="enviarPedido()">🚀 Confirmar Pedido</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let numeroMesa = urlParams.get('mesa') || '1';
        document.getElementById('label-mesa').innerText = numeroMesa;

        // Función corregida: usa rutas relativas para el API
        async function enviarAlerta(tipo) {
            try {
                let res = await fetch('/api/alerta-mesero', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesa: parseInt(numeroMesa), tipo: tipo })
                });
                if(res.ok) alert("Solicitud enviada exitosamente.");
                else alert("Error al contactar al servidor.");
            } catch (e) { alert("Error de conexión."); }
        }

        function filtrarCategoria(cat, btn) {
            document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.grupo-categoria').forEach(g => {
                g.style.display = (cat === 'todos' || g.dataset.categoria === cat) ? 'block' : 'none';
            });
        }
    </script>
    <script src="/static/script.js"></script>
</body>
</html>
